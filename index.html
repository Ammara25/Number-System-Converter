<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number System Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Number System Converter</h1>
        
        <div class="input-group">
            <label for="decimal">Decimal</label>
            <input type="text" id="decimal" placeholder="Enter decimal value...">
        </div>
        
        <div class="input-group">
            <label for="binary">Binary</label>
            <input type="text" id="binary" placeholder="Enter binary value...">
        </div>
        
        <div class="input-group">
            <label for="octal">Octal</label>
            <input type="text" id="octal" placeholder="Enter octal value...">
        </div>
        
        <div class="input-group">
            <label for="hexadecimal">Hexadecimal</label>
            <input type="text" id="hexadecimal" placeholder="Enter hex value...">
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
